# Starter manifest for a Forge app that hosts one or more Jira dashboard gadgets.
#
# This manifest has no `app.id` yet. Run `forge register` from this directory
# before your first deploy — it will ask for an app name and write the id here
# for you. See README.md for the full setup walkthrough.

modules:
  jira:dashboardGadget:
    - key: sprint-tri-burndown-gadget
      title: TRI Burndown
      description: Sprint burndown tracking dev complete, review complete and
        test complete (ideal, dev remaining, review remaining, remaining).
      thumbnail: https://raw.githubusercontent.com/wodutoit/jira-tri-burndown-change-dashboard-gadget/icons-v4/static/gadgets/public/icons/tri-burndown.svg
      resource: main
      resolver:
        function: resolver
      edit:
        resource: main

    - key: sprint-tri-scope-change-gadget
      title: TRI Scope Change
      description: Sprint scope change tracking — daily net SP change chart or
        a table of individual add/remove/excluded events.
      thumbnail: https://raw.githubusercontent.com/wodutoit/jira-tri-burndown-change-dashboard-gadget/icons-v4/static/gadgets/public/icons/tri-scope-change.svg
      resource: main
      resolver:
        function: resolver
      edit:
        resource: main

    - key: sprint-tri-rework-gadget
      title: TRI Rework
      description: Sprint rework tracking — daily test-failure kickback count
        chart or a table of individual rework events.
      thumbnail: https://raw.githubusercontent.com/wodutoit/jira-tri-burndown-change-dashboard-gadget/icons-v4/static/gadgets/public/icons/tri-rework.svg
      resource: main
      resolver:
        function: resolver
      edit:
        resource: main

    - key: sprint-tri-cycle-time-gadget
      title: TRI Cycle Time
      description: Cycle time per item — business hours spent in In Progress,
        Blocked, Code Review and Test, with estimate-vs-actual highlighting.
      thumbnail: https://raw.githubusercontent.com/wodutoit/jira-tri-burndown-change-dashboard-gadget/icons-v4/static/gadgets/public/icons/tri-cycle-time.svg
      resource: main
      resolver:
        function: resolver
      edit:
        resource: main

    - key: sprint-tri-filter-gadget
      title: TRI Sprint Filter
      description: Pick a space and sprint once — every other TRI-* gadget on
        this dashboard with "Use dashboard sprint filter" enabled follows the
        same selection automatically.
      thumbnail: https://raw.githubusercontent.com/wodutoit/jira-tri-burndown-change-dashboard-gadget/icons-v4/static/gadgets/public/icons/tri-sprint-filter.svg
      resource: main
      resolver:
        function: resolver
      edit:
        resource: main

    - key: sprint-tri-velocity-gadget
      title: TRI Velocity
      description: Capacity, Committed, and Velocity story points per closed
        sprint or completed iteration, read from each space's Capacity
        Planning data — one chart per space, with an optional combined Total
        when more than one space is configured. Only spaces with Capacity
        Planning enabled can be added.
      thumbnail: https://raw.githubusercontent.com/wodutoit/jira-tri-burndown-change-dashboard-gadget/icons-v4/static/gadgets/public/icons/tri-velocity.svg
      resource: main
      resolver:
        function: resolver
      edit:
        resource: main

    - key: sprint-tri-kanban-burnup-gadget
      title: TRI Kanban Burnup
      description: Cumulative burn-up for a Kanban iteration — Target,
        Development, Review, and Testing story points added since the
        iteration's start, read against a space's configured Capacity
        iterations. Only spaces with Capacity Planning enabled (Kanban) can
        be added.
      thumbnail: https://raw.githubusercontent.com/wodutoit/jira-tri-burndown-change-dashboard-gadget/icons-v4/static/gadgets/public/icons/tri-burndown.svg
      resource: main
      resolver:
        function: resolver
      edit:
        resource: main

    - key: sprint-tri-kanban-rework-gadget
      title: TRI Kanban Rework
      description: Kanban-iteration rework tracking — daily test-failure
        kickback count chart or a table of individual rework events, scoped
        to a space's configured Capacity iterations. Only spaces with
        Capacity Planning enabled (Kanban) can be added.
      thumbnail: https://raw.githubusercontent.com/wodutoit/jira-tri-burndown-change-dashboard-gadget/icons-v4/static/gadgets/public/icons/tri-rework.svg
      resource: main
      resolver:
        function: resolver
      edit:
        resource: main

    - key: sprint-tri-kanban-cycle-time-gadget
      title: TRI Kanban Cycle Time
      description: Cycle time per item for a Kanban iteration — business
        hours spent in In Progress, Blocked, Code Review and Test, with
        estimate-vs-actual highlighting. Only spaces with Capacity Planning
        enabled (Kanban) can be added.
      thumbnail: https://raw.githubusercontent.com/wodutoit/jira-tri-burndown-change-dashboard-gadget/icons-v4/static/gadgets/public/icons/tri-cycle-time.svg
      resource: main
      resolver:
        function: resolver
      edit:
        resource: main

  jira:projectSettingsPage:
    - key: tri-space-capacity-settings-page
      title: Capacity Planning
      resource: main
      resolver:
        function: resolver

  jira:projectPage:
    - key: tri-space-capacity-page
      title: Capacity
      resource: main
      resolver:
        function: resolver
      displayConditions:
        entityPropertyEqualTo:
          entity: project
          propertyKey: tri-capacity-planning
          objectName: enabled
          value: "true"

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: static/gadgets/build

permissions:
  scopes:
    - read:jira-work
    - read:issue:jira
    - read:project:jira
    - read:board-scope:jira-software
    - read:sprint:jira-software
    - read:issue-details:jira
    - read:jql:jira
    - storage:app
    - read:project.property:jira
    - write:project.property:jira
    - write:sprint:jira-software

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/517f0a5f-2176-4d4d-ab49-58514706fef1
